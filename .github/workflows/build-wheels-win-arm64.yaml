name: build-wheels-win-arm64

on:
  push:
    branches:
      - wheel
    tags:
      - '*'

  workflow_dispatch:

concurrency:
  group: build-wheels-win-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels_win_arm64:
    name: ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm]
        # A real python-version list is required: include: entries only
        # *merge into* existing combinations. Without this list the whole
        # matrix is a single combination and every include: overwrites the
        # previous one, so only the last entry (cp315) would run.
        python-version: ["cp311", "cp312", "cp313", "cp314", "cp315"]
        # CPython has native Windows ARM64 builds for 3.11 and later.
        # cp38/cp39/cp310 are skipped because actions/setup-python cannot find
        # an arm64 interpreter for them ("The version '3.10' with architecture
        # 'arm64' was not found for Windows Enterprise").
        #
        # python-version is the cibuildwheel selector; python-short is the same
        # version in actions/setup-python form, used only by the smoke test.
        # The smoke test runs outside cibuildwheel's venv, so without this the
        # host python3 is a different version and pip rejects the wheel with
        # "not a supported wheel on this platform".
        include:
          - python-version: "cp311"
            python-short: "3.11"
          - python-version: "cp312"
            python-short: "3.12"
          - python-version: "cp313"
            python-short: "3.13"
          - python-version: "cp314"
            python-short: "3.14"
          - python-version: "cp315"
            python-short: "3.15"

    steps:
      - uses: actions/checkout@v7

      # see https://cibuildwheel.readthedocs.io/en/stable/changelog/
      # for a list of versions
      # No cp38 split here: Windows on ARM has no CPython 3.8 (see above), so
      # cibuildwheel 4.x can be used for every entry in this matrix.
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.3
        env:
          CIBW_BUILD: "${{ matrix.python-version}}-* "
          CIBW_ARCHS: "ARM64"
          CIBW_BUILD_VERBOSITY: 3
          # No KALDI_DECODER_CMAKE_ARGS with -A ARM64: CMake on windows-11-arm
          # already targets the host architecture (ARM64). Passing -A makes
          # CMake fail with "Generator does not support platform
          # specification" when it picks Ninja.
          # cibuildwheel 4.x runs delvewheel repair by default on Windows.
          # The extension is self-contained (kaldifst/openfst are linked
          # statically), so there is nothing for delvewheel to bundle and it
          # errors with "Unable to find library: ...". Skip the repair step.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - name: Display wheels
        shell: bash
        run: |
          ls -lh ./wheelhouse/

          unzip -l ./wheelhouse/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.python-version }}-win-arm64
          path: ./wheelhouse/*.whl

      # A green compile does not prove the wheel imports on ARM64 -- actually
      # install it and run a decode before publishing. Run from outside the
      # source tree so `import kaldi_decoder` resolves to site-packages.
      #
      # This interpreter must match the wheel tag: cibuildwheel builds in its
      # own venv, so the runner default python3 would be some other version and
      # pip would answer "not a supported wheel on this platform".
      - name: Setup Python ${{ matrix.python-short }} for the smoke test
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-short }}

      - name: Smoke test
        shell: bash
        run: |
          python3 -m pip install --force-reinstall ./wheelhouse/*.whl
          # scripts/smoke_test.py builds the decoding graph with kaldifst
          python3 -m pip install --force-reinstall -U kaldifst

          cd "$RUNNER_TEMP"

          python3 "$GITHUB_WORKSPACE/scripts/smoke_test.py"


      - name: Publish wheels to PyPI
        shell: bash
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install wheel twine==5.0.0 setuptools

          # twine --skip-existing first queries
          # https://pypi.python.org/pypi/<name>/json -- the deprecated
          # hostname, hardcoded as LEGACY_PYPI in twine/repository.py (same
          # in 5.0.0 and 7.x). Runner DNS for that name is occasionally
          # flaky and fails the step even though upload.pypi.org is
          # reachable. Retry so a transient lookup error cannot sink an
          # otherwise-good publish; --skip-existing makes re-runs
          # idempotent, so retrying is safe.
          for _ in 1 2 3 4 5; do
            twine upload --skip-existing ./wheelhouse/*.whl && exit 0
            echo 'twine upload failed; retrying in 15s'
            sleep 15
          done
          exit 1
