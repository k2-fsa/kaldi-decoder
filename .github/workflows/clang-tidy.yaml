name: clang-tidy

on:
  push:
    branches:
      - master
      - port-decoder
  pull_request:
    branches:
      - master
      - port-decoder
  workflow_dispatch:

concurrency:
  group: clang-tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install clang-tidy
        shell: bash
        run: |
          python3 -m pip install -U pip
          python3 -m pip install clang-tidy==23.1.4

      - name: Configure
        shell: bash
        run: |
          mkdir build
          cd build
          cmake -DKALDI_DECODER_ENABLE_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPYTHON_EXECUTABLE=$(which python3) ..

      - name: Check with clang-tidy
        shell: bash
        run: |
          cd build
          make check
