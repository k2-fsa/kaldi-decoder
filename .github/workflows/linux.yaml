name: linux

on:
  push:
    branches:
      - master
      - port-decoder
  pull_request:
    branches:
      - master
      - port-decoder

  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        # 3.8/3.9 skipped: ubuntu-26.04 images no longer ship those
        # interpreters, and cp38/39 kaldifst wheels predate the pybind11
        # internals used here (cross-module FST returns fail).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # numpy 1.x/2.x are both supported; the main matrix runs 2.x and
        # the include below adds one 1.x cell per OS (numpy<2 has no
        # wheels for Python >= 3.13, hence 3.12).
        numpy: ["2"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            numpy: "1"
          - os: ubuntu-24.04-arm
            python-version: "3.12"
            numpy: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install Python dependencies
        shell: bash
        run: |
          python3 -m pip install -U pip
          python3 -m pip install "kaldifst>=1.9.0" "numpy~=${{ matrix.numpy }}.0"

      - name: Configure CMake
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          mkdir build
          cd build
          cmake -D CMAKE_BUILD_TYPE=Release -DKALDI_DECODER_ENABLE_TESTS=ON ..

      - name: Build
        run: |
          cd build
          make -j2

          ls -lh lib

      - name: Test
        run: |
          cd build
          ctest --output-on-failure
