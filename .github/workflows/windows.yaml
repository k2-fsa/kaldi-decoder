name: windows

on:
  push:
    branches:
      - master
      - port-decoder
  pull_request:
    branches:
      - master
      - port-decoder

  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # numpy 1.x/2.x are both supported; the main matrix runs 2.x and
        # the include below adds one 1.x cell per OS (numpy<2 has no
        # wheels for Python >= 3.13, hence 3.12).
        numpy: ["2"]
        include:
          - os: windows-latest
            python-version: "3.12"
            numpy: "1"
          - os: windows-11-arm
            python-version: "3.12"
            numpy: "1"
        exclude:
          # Windows on ARM only ships CPython 3.11+ (same as
          # ../kaldi-native-fbank's build-wheels-win-arm64.yaml), so there
          # are no 3.8-3.10 interpreters for windows-11-arm.
          - os: windows-11-arm
            python-version: "3.8"
          - os: windows-11-arm
            python-version: "3.9"
          - os: windows-11-arm
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # see https://github.com/microsoft/setup-msbuild
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install Python dependencies
        shell: bash
        run: |
          python3 -m pip install -U pip
          python3 -m pip install "kaldifst>=1.9.0" "numpy~=${{ matrix.numpy }}.0"

      - name: Configure CMake
        shell: bash
        run: |
          mkdir build
          cd build
          cmake -D CMAKE_BUILD_TYPE=Release -DKALDI_DECODER_ENABLE_TESTS=ON ..

      - name: Build
        shell: bash
        run: |
          cd build
          cmake --build . --target ALL_BUILD --config Release
          ls -lh ./lib/Release/*
          ls -lh ./bin/Release/*

      - name: Test
        shell: bash
        run: |
          cd build
          export PYTHONPATH=$PWD/lib/Release:$PYTHONPATH
          export PYTHONPATH=$PWD/../kaldi-decoder/python:$PYTHONPATH

          ctest -C Release --output-on-failure
